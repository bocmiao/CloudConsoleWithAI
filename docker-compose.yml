# Miao Panel（喵面板）Web 版：docker compose up -d
# 详细说明（HTTPS、反向代理、忘记密码、升级）见 docs/DEPLOY.md
services:
  miaopanel:
    build: .
    image: miaopanel:latest
    container_name: miaopanel
    restart: unless-stopped
    # Linux 服务器上直接使用主机网络，让本机反向代理的来源保持为 127.0.0.1，
    # 不需要把整个 Docker 私网段列为可信代理。
    network_mode: host
    volumes:
      - miaopanel-data:/data   # 数据库和密钥都在这里，请定期备份
    environment:
      TZ: Asia/Shanghai        # 日报按这个时区生成
      MIAO_LISTEN: 127.0.0.1:18765

volumes:
  miaopanel-data:

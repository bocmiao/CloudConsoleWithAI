# Nginx 反向代理 Miao Panel（HTTPS 证书路径换成你自己的）。
# 1Panel、宝塔的「反向代理」网站也按这里核对：几条 proxy_* 设置都要有。
server {
    listen 80;
    server_name panel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;                # 新版 Nginx 会提示改用 http2 on;，不影响使用
    server_name panel.example.com;
    ssl_certificate     /etc/ssl/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/panel.example.com/privkey.pem;

    client_max_body_size 0;              # 文件管理上传大文件

    location / {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;              # 登录失败按访客 IP 限制
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;           # 让登录 Cookie 只走 HTTPS
        proxy_buffering off;             # AI 的回答、终端输出要实时显示
        proxy_request_buffering off;     # 上传边传边写，不先存到 Nginx
        proxy_read_timeout 3600s;        # 终端可以长时间开着
        proxy_send_timeout 3600s;
    }
}
